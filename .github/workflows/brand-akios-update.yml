name: Apply JDEVPRO branding and AKIOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brand-akios-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply branding and AKIOS prominence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          LOGO_B64 = ''''''
          asset = Path('assets/logo-jdevpro.webp')
          asset.parent.mkdir(parents=True, exist_ok=True)
          asset.write_bytes(base64.b64decode(LOGO_B64))

          cards = {
            'index.html': '''<article class="featured-project reveal akios-featured">
<div class="featured-copy">
<div class="project-meta"><span>FLAGSHIP · IOT LIFECYCLE</span><span>AKIOS.CLOUD</span></div>
<h3>AKIOS</h3>
<p class="project-lead">Baseline di lifecycle on-device per vendor IoT: provisioning resiliente, OTA in trial con health gate, rollback e recovery deterministici, con tracciabilità operativa e senza imporre una migrazione cloud.</p>
<p>Standardizza il livello di lifecycle tra famiglie di dispositivi e SoC mantenendo separati core invariants, system app aggiornabili e integrazioni vendor. Il percorso è incrementale: PoC su un device, pilot su una famiglia, rollout con profili hardware ed evidence pack.</p>
<div class="tags"><span>IoT lifecycle</span><span>OTA</span><span>health gates</span><span>rollback</span><span>recovery</span><span>CRA / ETSI</span></div>
<div class="project-actions"><a class="button light" href="https://akios.cloud/" rel="noreferrer" target="_blank">Apri AKIOS ↗</a></div>
</div>
<div aria-label="AKIOS lifecycle model" class="terminal">
<div class="terminal-bar"><span></span><span></span><span></span><b>akios::lifecycle</b></div>
<pre><code>$ lifecycle
provision → trial → health
failure   → rollback → recovery

$ boundary
device lifecycle  AKIOS
cloud + product   vendor

$ evidence
logs → decisions → repeatable tests</code></pre>
</div>
</article>
''',
            'en.html': '''<article class="featured-project reveal akios-featured">
<div class="featured-copy">
<div class="project-meta"><span>FLAGSHIP · IOT LIFECYCLE</span><span>AKIOS.CLOUD</span></div>
<h3>AKIOS</h3>
<p class="project-lead">An on-device lifecycle baseline for IoT vendors: resilient provisioning, health-gated trial OTA, deterministic rollback and recovery, with operational traceability and no forced cloud migration.</p>
<p>It standardizes the lifecycle layer across device families and SoCs while keeping core invariants, transactionally updatable system apps and vendor integrations clearly separated. Adoption is incremental: device PoC, family pilot, then rollout with hardware profiles and evidence packs.</p>
<div class="tags"><span>IoT lifecycle</span><span>OTA</span><span>health gates</span><span>rollback</span><span>recovery</span><span>CRA / ETSI</span></div>
<div class="project-actions"><a class="button light" href="https://akios.cloud/" rel="noreferrer" target="_blank">Open AKIOS ↗</a></div>
</div>
<div aria-label="AKIOS lifecycle model" class="terminal">
<div class="terminal-bar"><span></span><span></span><span></span><b>akios::lifecycle</b></div>
<pre><code>$ lifecycle
provision → trial → health
failure   → rollback → recovery

$ boundary
device lifecycle  AKIOS
cloud + product   vendor

$ evidence
logs → decisions → repeatable tests</code></pre>
</div>
</article>
'''
          }

          for name in ('index.html', 'en.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')

              text = re.sub(
                  r'<a aria-label="JDEVPRO home" class="brand" href="#top">\s*<span class="brand-mark">J</span>\s*<span>JDEVPRO</span>\s*</a>',
                  '<a aria-label="JDEVPRO home" class="brand" href="#top"><img class="brand-logo" src="assets/logo-jdevpro.webp" alt="JDEVPRO"></a>',
                  text,
                  count=1,
                  flags=re.S,
              )

              if 'class="hero-brand"' not in text:
                  text = text.replace(
                      '<div class="hero-copy reveal">',
                      '<div class="hero-copy reveal">\n<a class="hero-brand" href="#top" aria-label="JDEVPRO"><img src="assets/logo-jdevpro.webp" alt="JDEVPRO"></a>',
                      1,
                  )

              if '>AKIOS ↗</a>' not in text:
                  marker = '<div aria-label="Profili esterni" class="hero-links">' if name == 'index.html' else '<div aria-label="External profiles" class="hero-links">'
                  text = text.replace(marker, marker + '\n<a href="https://akios.cloud/" rel="noreferrer" target="_blank">AKIOS ↗</a>', 1)

              if '<h3>AKIOS</h3>' not in text:
                  text = text.replace('<article class="featured-project reveal">', cards[name] + '<article class="featured-project reveal">', 1)

              footer_anchor = '<div><a href="privacy.html">Privacy</a>' if name == 'index.html' else '<div><a href="privacy-en.html">Privacy</a>'
              if footer_anchor in text and 'footer-grid' in text and '>AKIOS</a>' not in text[text.rfind('<footer'):]:
                  text = text.replace(footer_anchor, footer_anchor + '<a href="https://akios.cloud/" rel="noreferrer" target="_blank">AKIOS</a>', 1)

              p.write_text(text, encoding='utf-8')

          css = Path('styles.css')
          c = css.read_text(encoding='utf-8')
          if '.brand-logo {' not in c:
              c += '''\n\n/* JDEVPRO identity + flagship project */
.brand-logo { width: 174px; height: auto; display: block; object-fit: contain; }
.hero-brand { display: inline-block; margin: 0 0 24px; text-decoration: none; }
.hero-brand img { width: min(330px, 72vw); height: auto; display: block; filter: drop-shadow(0 14px 30px rgba(0,0,0,.28)); }
.akios-featured { border-color: rgba(86,200,255,.22); background: radial-gradient(circle at 68% 30%, rgba(86,200,255,.10), transparent 28%), radial-gradient(circle at 20% 80%, rgba(45,212,191,.07), transparent 30%), var(--navy-2); }
.featured-project + .featured-project { margin-top: 18px; }
@media (max-width: 760px) {
  .brand-logo { width: 145px; }
  .hero-brand { margin-bottom: 18px; }
  .hero-brand img { width: min(280px, 78vw); }
}
'''
              css.write_text(c, encoding='utf-8')

          # Remove this one-time workflow before committing the actual site change.
          Path('.github/workflows/brand-akios-update.yml').unlink(missing_ok=True)
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "jellero"
          git config user.email "j.ellero@gmail.com"
          git add -A
          git commit -m "Integrate JDEVPRO logo and feature AKIOS" || exit 0
          git push
