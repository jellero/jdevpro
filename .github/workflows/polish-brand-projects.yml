name: Polish brand and project showcase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-brand-projects.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply visual polish
        shell: bash
        run: |
          cat > overrides.css <<'CSS'
          /* Brand visibility */
          .brand {
            width: 150px;
            height: 58px;
            overflow: hidden;
            border-radius: 10px;
            flex: 0 0 auto;
          }
          .brand-logo {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            object-fit: cover !important;
            object-position: center 54% !important;
            display: block;
          }
          .hero-brand-logo {
            display: block !important;
            width: min(590px, 92vw) !important;
            aspect-ratio: 1.965 / 1 !important;
            overflow: hidden !important;
            margin: 0 0 30px !important;
            border-radius: 18px !important;
            background: #000 !important;
            box-shadow: 0 24px 70px rgba(0,0,0,.34) !important;
          }
          .hero-brand-logo img {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            object-fit: cover !important;
            object-position: center 54% !important;
            border-radius: 0 !important;
            box-shadow: none !important;
          }

          /* Secondary showcase projects: same visual language, no dump/list section */
          .showcase-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0,1fr));
            gap: 18px;
            margin-top: 18px;
          }
          .showcase-card {
            min-height: 255px;
            background:
              radial-gradient(circle at 90% 10%, rgba(86,200,255,.09), transparent 35%),
              rgba(255,255,255,.035);
          }
          .showcase-card .project-meta span:first-child { color: var(--cyan); }
          .showcase-card h3 { font-size: 1.7rem; }
          .showcase-card .card-link { margin-top: auto; padding-top: 24px; }

          @media (max-width: 900px) {
            .brand { width: 132px; height: 52px; }
            .hero-brand-logo { width: min(520px, 92vw) !important; }
          }
          @media (max-width: 760px) {
            .brand { width: 118px; height: 46px; }
            .hero-brand-logo {
              width: min(430px, 92vw) !important;
              margin-bottom: 22px !important;
            }
            .showcase-grid { grid-template-columns: 1fr; }
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': (
          '''<div class="more-work reveal">
          <div>
          <span class="eyebrow">Altri lavori pubblici</span>
          <h3>Dal prodotto digitale al sito verticale.</h3>
          </div>
          <div class="more-links">
          <a href="https://apicolturapura.it/" rel="noreferrer" target="_blank"><strong>Bioapicoltura Pura</strong><span>Sito vetrina ↗</span></a>
          <a href="https://jellero.github.io/dream/" rel="noreferrer" target="_blank"><strong>Dream Studio Design</strong><span>Sito vetrina multipagina ↗</span></a>
          <a href="https://github.com/jellero" rel="noreferrer" target="_blank"><strong>Tutti i repository</strong><span>Profilo GitHub completo ↗</span></a>
          </div>
          </div>''',
          '''<div class="showcase-grid">
          <article class="project-card showcase-card reveal">
          <div class="project-meta"><span>WEB · BRAND</span><span>SITO PUBBLICO</span></div>
          <h3>Bioapicoltura Pura</h3>
          <p>Sito vetrina dedicato all'attività apistica: presenza digitale essenziale, contenuti chiari e accesso diretto al progetto online.</p>
          <div class="tags"><span>showcase</span><span>responsive web</span><span>public site</span></div>
          <a class="card-link" href="https://apicolturapura.it/" rel="noreferrer" target="_blank">Visita il sito ↗</a>
          </article>
          <article class="project-card showcase-card reveal">
          <div class="project-meta"><span>WEB · SHOWCASE</span><span>MULTIPAGINA</span></div>
          <h3>Dream Studio Design</h3>
          <p>Sito vetrina multipagina progettato per presentare servizi, identità e contenuti con una struttura web completa e navigabile.</p>
          <div class="tags"><span>multi-page</span><span>showcase</span><span>responsive web</span></div>
          <a class="card-link" href="https://jellero.github.io/dream/" rel="noreferrer" target="_blank">Visita il sito ↗</a>
          </article>
          </div>'''
              ),
              'en.html': (
          '''<div class="more-work reveal">
          <div>
          <span class="eyebrow">Other public work</span>
          <h3>From digital products to focused web projects.</h3>
          </div>
          <div class="more-links">
          <a href="https://apicolturapura.it/" rel="noreferrer" target="_blank"><strong>Bioapicoltura Pura</strong><span>Showcase website ↗</span></a>
          <a href="https://jellero.github.io/dream/" rel="noreferrer" target="_blank"><strong>Dream Studio Design</strong><span>Multi-page showcase website ↗</span></a>
          <a href="https://github.com/jellero" rel="noreferrer" target="_blank"><strong>All repositories</strong><span>Full GitHub profile ↗</span></a>
          </div>
          </div>''',
          '''<div class="showcase-grid">
          <article class="project-card showcase-card reveal">
          <div class="project-meta"><span>WEB · BRAND</span><span>PUBLIC WEBSITE</span></div>
          <h3>Bioapicoltura Pura</h3>
          <p>A focused showcase website for the beekeeping activity, with a clear digital presence and direct access to the live project.</p>
          <div class="tags"><span>showcase</span><span>responsive web</span><span>public site</span></div>
          <a class="card-link" href="https://apicolturapura.it/" rel="noreferrer" target="_blank">Visit website ↗</a>
          </article>
          <article class="project-card showcase-card reveal">
          <div class="project-meta"><span>WEB · SHOWCASE</span><span>MULTI-PAGE</span></div>
          <h3>Dream Studio Design</h3>
          <p>A multi-page showcase website designed to present services, identity and content through a complete navigable web structure.</p>
          <div class="tags"><span>multi-page</span><span>showcase</span><span>responsive web</span></div>
          <a class="card-link" href="https://jellero.github.io/dream/" rel="noreferrer" target="_blank">Visit website ↗</a>
          </article>
          </div>'''
              )
          }

          for name, (old, new) in replacements.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected section not found in {name}')
              text = text.replace(old, new, 1)
              css_link = '<link href="styles.css" rel="stylesheet"/>'
              if 'overrides.css' not in text:
                  text = text.replace(css_link, css_link + '\n<link href="overrides.css" rel="stylesheet"/>', 1)
              p.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/polish-brand-projects.yml

      - name: Commit changes
        run: |
          git config user.name "jellero"
          git config user.email "j.ellero@gmail.com"
          git add -A
          git commit -m "Improve JDEVPRO branding and web project showcase" || exit 0
          git push
