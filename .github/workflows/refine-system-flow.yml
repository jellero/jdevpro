name: Refine integration card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-system-flow.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace integration card
        env:
          OLD_IT: 
          NEW_IT: 
          OLD_EN: 
          NEW_EN: 
          FLOW_CSS: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          pairs = {
              'index.html': (os.environ['OLD_IT'], os.environ['NEW_IT']),
              'en.html': (os.environ['OLD_EN'], os.environ['NEW_EN']),
          }
          for filename, (old_b64, new_b64) in pairs.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              old = base64.b64decode(old_b64).decode('utf-8')
              new = base64.b64decode(new_b64).decode('utf-8')
              if old not in text:
                  raise SystemExit(f'Expected integration block not found in {filename}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          p = Path('overrides.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* System integration card v2 */'
          if marker not in css:
              css += base64.b64decode(os.environ['FLOW_CSS']).decode('utf-8')
              p.write_text(css, encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "jellero"
          git config user.email "j.ellero@gmail.com"
          git rm .github/workflows/refine-system-flow.yml
          git add index.html en.html overrides.css
          git commit -m "Replace diagram with end-to-end integration flow"
          git push
      - name: Remove accidental temporary branches
        continue-on-error: true
        run: |
          git push origin --delete tmp-cname-fix tmp-cname-fix2 tmp-cname-fix3 tmp-cname-fix4 tmp-cname-fix5 || true
