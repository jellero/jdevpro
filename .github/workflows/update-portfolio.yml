name: Update portfolio projects

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Italian and English portfolio sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def update_it(path):
              t = Path(path).read_text()

              t = t.replace(
                  '<div class="dual-links"><a class="card-link" href="https://jellero.github.io/vehylo-web/" rel="noreferrer" target="_blank">Sito ↗</a><a class="card-link secondary" href="https://github.com/jellero/vehylo-web" rel="noreferrer" target="_blank">Codice ↗</a></div>',
                  '<a class="card-link" href="https://jellero.github.io/vehylo-web/" rel="noreferrer" target="_blank">Sito ↗</a>'
              )
              t = t.replace(
                  '<div class="dual-links"><a class="card-link" href="https://jellero.github.io/welora-web/" rel="noreferrer" target="_blank">Sito ↗</a><a class="card-link secondary" href="https://github.com/jellero/welora-web" rel="noreferrer" target="_blank">Codice ↗</a></div>',
                  '<a class="card-link" href="https://jellero.github.io/welora-web/" rel="noreferrer" target="_blank">Sito ↗</a>'
              )

              if 'Oryzeno OpenLink' not in t:
                  marker = '<article class="project-card reveal">\n<div class="project-meta"><span>WEB PLATFORM</span><span>Slim · PHP · i18n</span></div>\n<h3>Lauco Experience</h3>'
                  card = '''<article class="project-card reveal">\n<div class="project-meta"><span>CONNECTIVITY R&amp;D</span><span>Satellite · Edge · IoT</span></div>\n<h3>Oryzeno OpenLink</h3>\n<p>Progetto per connettività satellitare essenziale a basso consumo destinata a impianti, sensori, telecamere, infrastrutture remote e scenari di emergenza.</p>\n<div class="tags"><span>satellite</span><span>edge</span><span>MQTT/API</span></div>\n<a class="card-link" href="https://github.com/jellero/Oryzeno" rel="noreferrer" target="_blank">Apri progetto ↗</a>\n</article>\n'''
                  if marker not in t:
                      raise SystemExit('Italian Lauco marker not found')
                  t = t.replace(marker, card + marker, 1)

              t = t.replace(
                  '<a href="https://github.com/jellero/jdev-industry" rel="noreferrer" target="_blank"><strong>JDEV Industry</strong><span>Integrazione macchine Industria 4.0 ↗</span></a>\n',
                  ''
              )

              if 'Dream Studio Design' not in t:
                  bio = '<a href="https://jellero.github.io/apicolturapura/" rel="noreferrer" target="_blank"><strong>Bioapicoltura Pura</strong><span>Sito vetrina · GitHub Pages ↗</span></a>\n'
                  dream = '<a href="https://jellero.github.io/dream/" rel="noreferrer" target="_blank"><strong>Dream Studio Design</strong><span>Sito vetrina multipagina ↗</span></a>\n'
                  if bio not in t:
                      raise SystemExit('Italian public-work marker not found')
                  t = t.replace(bio, bio + dream, 1)

              Path(path).write_text(t)

          def update_en(path):
              t = Path(path).read_text()

              t = t.replace(
                  '<div class="dual-links"><a class="card-link" href="https://jellero.github.io/vehylo-web/" rel="noreferrer" target="_blank">Website ↗</a><a class="card-link secondary" href="https://github.com/jellero/vehylo-web" rel="noreferrer" target="_blank">Code ↗</a></div>',
                  '<a class="card-link" href="https://jellero.github.io/vehylo-web/" rel="noreferrer" target="_blank">Website ↗</a>'
              )
              t = t.replace(
                  '<div class="dual-links"><a class="card-link" href="https://jellero.github.io/welora-web/" rel="noreferrer" target="_blank">Website ↗</a><a class="card-link secondary" href="https://github.com/jellero/welora-web" rel="noreferrer" target="_blank">Code ↗</a></div>',
                  '<a class="card-link" href="https://jellero.github.io/welora-web/" rel="noreferrer" target="_blank">Website ↗</a>'
              )

              if 'Oryzeno OpenLink' not in t:
                  marker = '<article class="project-card reveal">\n<div class="project-meta"><span>WEB PLATFORM</span><span>Slim · PHP · i18n</span></div>\n<h3>Lauco Experience</h3>'
                  card = '''<article class="project-card reveal">\n<div class="project-meta"><span>CONNECTIVITY R&amp;D</span><span>Satellite · Edge · IoT</span></div>\n<h3>Oryzeno OpenLink</h3>\n<p>Low-power essential satellite connectivity concept for plants, sensors, cameras, remote infrastructure and emergency scenarios.</p>\n<div class="tags"><span>satellite</span><span>edge</span><span>MQTT/API</span></div>\n<a class="card-link" href="https://github.com/jellero/Oryzeno" rel="noreferrer" target="_blank">Open project ↗</a>\n</article>\n'''
                  if marker not in t:
                      raise SystemExit('English Lauco marker not found')
                  t = t.replace(marker, card + marker, 1)

              t = t.replace(
                  '<a href="https://github.com/jellero/jdev-industry" rel="noreferrer" target="_blank"><strong>JDEV Industry</strong><span>Industry 4.0 machine integration ↗</span></a>\n',
                  ''
              )

              if 'Dream Studio Design' not in t:
                  bio = '<a href="https://jellero.github.io/apicolturapura/" rel="noreferrer" target="_blank"><strong>Bioapicoltura Pura</strong><span>Showcase website · GitHub Pages ↗</span></a>\n'
                  dream = '<a href="https://jellero.github.io/dream/" rel="noreferrer" target="_blank"><strong>Dream Studio Design</strong><span>Multi-page showcase website ↗</span></a>\n'
                  if bio not in t:
                      raise SystemExit('English public-work marker not found')
                  t = t.replace(bio, bio + dream, 1)

              Path(path).write_text(t)

          update_it('index.html')
          update_en('en.html')
          PY

      - name: Commit portfolio changes
        shell: bash
        run: |
          if git diff --quiet -- index.html en.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en.html
          git commit -m "Update public portfolio projects"
          git push
