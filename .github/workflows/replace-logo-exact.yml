name: Replace JDEVPRO logo exact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-logo-exact.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact supplied PNG
        run: |
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-0268-81f4-80f1-068f2398a45c/raw?se=2026-10-06T13%3A09%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=b510c72f-5ebd-588a-884d-84261d46171c&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T04%3A31%3A13Z&ske=2026-10-07T04%3A31%3A13Z&sks=b&skv=2026-02-06&sig=nBbHy5Sh4B4sbTikyJNzcRxFx0IZLryCEamo6QP0iB0%3D' -o assets/logo-jdevpro.png
          echo '07b1b5e594ec788c9bb135906dfcd44545dbf91d9e1e1db22930748cc47bd6b1  assets/logo-jdevpro.png' | sha256sum -c -
          file assets/logo-jdevpro.png

      - name: Wire the exact PNG into the site
        run: |
          sed -i 's#assets/logo-jdevpro\.webp#assets/logo-jdevpro.png#g' index.html en.html script.js
          cat > overrides.css <<'CSS'
          /* JDEVPRO logo — exact supplied PNG, no image conversion or generated substitute. */
          .brand {
            width: 220px;
            height: 68px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            overflow: visible;
            background: none !important;
            border: 0;
            border-radius: 0;
          }
          .brand-logo {
            display: block !important;
            width: 220px !important;
            height: auto !important;
            max-width: none !important;
            object-fit: contain !important;
            object-position: left center !important;
            margin-top: -28px;
            margin-bottom: -28px;
            opacity: 1 !important;
            visibility: visible !important;
          }
          .hero-brand-logo { display: none !important; }
          @media (max-width: 900px) {
            .brand { width: 190px; height: 60px; }
            .brand-logo { width: 190px !important; margin-top: -24px; margin-bottom: -24px; }
          }
          @media (max-width: 760px) {
            .brand { width: 160px; height: 52px; }
            .brand-logo { width: 160px !important; margin-top: -20px; margin-bottom: -20px; }
          }
          CSS
          rm -f assets/logo-jdevpro.webp assets/logo-jdevpro-header.webp assets/logo-jdevpro-hero.webp
          rm -f .github/workflows/replace-logo-exact.yml

      - name: Commit exact supplied logo
        run: |
          git config user.name "jellero"
          git config user.email "j.ellero@gmail.com"
          git add -A
          git commit -m "Use exact supplied JDEVPRO PNG" || exit 0
          git push
