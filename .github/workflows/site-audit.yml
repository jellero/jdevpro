name: Verifica qualità sito

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica SEO, sitemap, link e asset
        run: python3 tools/check_site.py
      - name: Verifica sintassi JavaScript
        run: node --check script.js
      - name: Test rigenerazione senza pubblicazione
        run: |
          mkdir -p "$RUNNER_TEMP/jdevpro-preview"
          cp -a . "$RUNNER_TEMP/jdevpro-preview/"
          python3 _tools/build_site.py "$RUNNER_TEMP/jdevpro-preview"
          python3 "$RUNNER_TEMP/jdevpro-preview/tools/check_site.py"
          grep -q 'Digital Receptionist' "$RUNNER_TEMP/jdevpro-preview/digital-receptionist.html"
          grep -q 'Digital Receptionist' "$RUNNER_TEMP/jdevpro-preview/en-digital-receptionist.html"
          grep -q 'digital-receptionist.html' "$RUNNER_TEMP/jdevpro-preview/prodotti.html"
          grep -q 'en-digital-receptionist.html' "$RUNNER_TEMP/jdevpro-preview/en-products.html"

