name: Fix ORYVAEL markup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-oryvael.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix markup
        run: echo '' | base64 -d | python3
      - name: Commit fix
        run: |
          git config user.name "jellero"
          git config user.email "j.ellero@gmail.com"
          git add -A
          git commit -m "Fix ORYVAEL featured project markup" || exit 0
          git push
