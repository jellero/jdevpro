name: Finalize portfolio site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-site.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final static changes
        shell: bash
        run: echo '' | base64 -d | python3
      - name: Commit final site state
        shell: bash
        run: |
          git config user.name "jellero"
          git config user.email "j.ellero@gmail.com"
          git add -A
          git commit -m "Finalize JDEVPRO portfolio links and branding" || exit 0
          git push
